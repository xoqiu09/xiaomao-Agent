[project]
name = "xiaomao-agent"
version = "0.2.2"
description = "小猫：本机只读工程观察员（采集与推理解耦）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xiaomao" }]
dependencies = []

[project.scripts]
xiaomao = "xiaomao.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiaomao"]

[tool.hatch.build.targets.wheel.sources]
"src/xiaomao" = "xiaomao"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
